name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,providers]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Run type checker
        run: mypy src/contextforge

      - name: Run tests
        run: pytest

      - name: Run deterministic evaluation smoke suite
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          contextforge evaluate tests/fixtures/evaluation/suites/core.json
          --case direct-path
          --output /tmp/contextforge-evaluation/latest
          --fail-on-case-error
          --minimum required-artifact-recall=1.0

      - name: Run reviewed evaluation baseline gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          contextforge evaluate tests/fixtures/evaluation/suites/core.json
          --output /tmp/contextforge-evaluation/core
          --fail-on-case-error
          --minimum complete-evidence=0.875
          --minimum context-precision=1.0
          --minimum ndcg=0.8
          --minimum required-artifact-recall=0.875
          --maximum context-irrelevant-ratio=0.0

      - name: Verify package build
        run: python scripts/build-release.py
