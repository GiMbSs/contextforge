[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge"
version = "0.1.0"
description = "Context engineering engine for building precise, traceable LLM context."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Gilberto Neto", email = "gn.dev3@gmail.com" },
]
dependencies = [
  "typer>=0.12,<1.0",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
providers = [
  "httpx>=0.27,<1.0",
]
dev = [
  "build>=1.2,<2.0",
  "hypothesis>=6.100,<7.0",
  "mypy>=1.15,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
contextforge = "contextforge.cli.main:main"

[project.urls]
Repository = "https://github.com/GiMbSs/contextforge"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--cov=contextforge",
  "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "build",
  "dist",
  "docs",
  "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["contextforge"]
exclude = [
  "^build/",
  "^dist/",
  "^tests/fixtures/",
]

[tool.coverage.run]
branch = true
source = ["contextforge"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
